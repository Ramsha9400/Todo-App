<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To Do app | @stackanddstyle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="stage">

    <!-- The To Do card -->
    <section class="card" aria-labelledby="title">

      <header class="card-head">
        <!-- Sound on / off (M) -->
        <button class="btn round tool" id="soundBtn" type="button"
                aria-pressed="true" aria-label="Sound" title="Sound (M)">
          <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
            <path d="M19 5a10 10 0 0 1 0 14"/>
          </svg>
          <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <line x1="23" y1="9" x2="17" y2="15"/>
            <line x1="17" y1="9" x2="23" y2="15"/>
          </svg>
        </button>

        <h1 id="title">ToDo List</h1>

        <!-- Reset everything (R) -->
        <button class="btn round tool" id="resetBtn" type="button"
                aria-label="Reset" title="Reset (R)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/>
          </svg>
        </button>
      </header>

      <!-- Add a task -->
      <form class="add" id="addForm" autocomplete="off">
        <label class="sr" for="taskInput">New task</label>
        <input class="field" id="taskInput" type="text" maxlength="40"
               placeholder="Enter a task...">
        <button class="btn round add-btn" type="submit" aria-label="Add task">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </form>

      <!-- Tasks are created by script.js -->
      <ul class="list" id="list" aria-label="Tasks"></ul>

      <p class="empty" id="empty">No tasks yet</p>

      <button class="btn clear" id="clearBtn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
        Clear All
      </button>
    </section>

    <p class="hint">
      <kbd>Enter</kbd> add &nbsp;·&nbsp; <kbd>/</kbd> focus &nbsp;·&nbsp;
      <kbd>R</kbd> reset &nbsp;·&nbsp; <kbd>M</kbd> sound
    </p>
  </main>

  <p class="credit">Created by <b>@stackanddstyle</b></p>

  <script src="script.js"></script>
</body>
</html>
